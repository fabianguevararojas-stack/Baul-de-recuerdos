<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baúl de recuerdos</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8e1e7;
      font-family: Georgia, serif;
    }
    .carta {
      background: #fffaf0;
      max-width: 340px;
      margin: 20px;
      padding: 28px 24px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      text-align: center;
    }
    h1 { color: #b03a5b; margin-top: 0; }
    p { color: #444; line-height: 1.6; }
    button {
      background: #b03a5b;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 25px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="carta">
    <h1>Para ti</h1>
    <p>Aquí irá mi carta...</p>
    <button>Abrir el baúl</button>
  </div>
</body>
</html>
